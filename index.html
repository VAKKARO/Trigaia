<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundi Llumgaia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Audio Autoplay -->
    <audio id="bg-audio" src="public/assets/ambientefinal.mp3" autoplay loop></audio>
    
    <div id="app">
        <!-- Scene 1: Map -->
        <div id="scene-map" class="scene active">
            <picture>
                <source media="(max-width: 768px)" srcset="public/assets/map_mobile.jpg">
                <img src="public/assets/map.jpg" alt="Mapa de Llumgaia" class="background-img">
            </picture>
            
            <!-- Clickable area for the central continent (Mundi Llumgaia) -->
            <div id="continent-hitbox"></div>
            <!-- Clickable area for Sakurania -->
            <div id="sakurania-hitbox"></div>
            
            <!-- Password Modal -->
            <div id="password-modal" class="hidden">
                <div class="modal-content">
                    <h2>INTRODUCIR CONTRASEÑA</h2>
                    <input type="text" id="password-input">
                    <button id="submit-button">ENVIAR</button>
                    <p id="error-message" class="hidden">Contraseña incorrecta</p>
                </div>
            </div>
        </div>
        
        <!-- Scene 2: Egg -->
        <div id="scene-egg" class="scene">
            <picture>
                <source media="(max-width: 768px)" srcset="public/assets/egg_scene_mobile.jpg">
                <img src="public/assets/egg_scene_3.jpg" alt="Escenario del Huevo" class="background-img">
            </picture>
            
            <!-- Instruction Text -->
            <h1 class="fantasy-instruction">Envíale tu energía al núcleo</h1>
            
            <!-- Egg Hitbox -->
            <div id="egg-hitbox"></div>
            
            <!-- Progress Bar -->
            <div id="progress-container">
                <div id="progress-bar">
                    <div class="sparkles"></div>
                </div>
            </div>
            
            <!-- Flapping Dragon Container -->
            <div id="dragon-container" class="dragon-container">
                <img src="public/assets/dragon_f1.png" alt="Dragón F1" id="dragon_f1" class="dragon-frame">
                <img src="public/assets/dragon_f2.png" alt="Dragón F2" id="dragon_f2" class="dragon-frame">
                <img src="public/assets/dragon_f3.png" alt="Dragón F3" id="dragon_f3" class="dragon-frame">
                <img src="public/assets/dragon_f4.png" alt="Dragón F4" id="dragon_f4" class="dragon-frame">
            </div>
            <!-- Volver Button -->
            <button id="reset-button" class="hidden">VOLVER</button>
        </div>

        <!-- Scene 3: Sakurania -->
        <div id="scene-sakurania" class="scene">
            <picture>
                <source media="(max-width: 768px)" srcset="public/assets/sakurania_bg_mobile.jpg">
                <img src="public/assets/sakurania_bg.jpg" alt="Fondo Sakurania" class="background-img">
            </picture>
            
            <h1 class="fantasy-instruction">Recolecta las sakura en el cuenco</h1>
            
            <img src="public/assets/sakurania_tree.png" alt="Arbol Sakura" id="sakurania-tree">
            
            <img src="public/assets/sakurania_neutral.png" alt="Niña Sakurania" id="sakurania-character">
            <img src="public/assets/bowl.png" alt="Cuenco" id="sakurania-bowl">
            
            <!-- Sakurania Dragon -->
            <div id="sakurania-dragon-container" class="dragon-container">
                <img src="public/assets/dragon_f1.png" alt="Dragón F1" class="dragon-frame">
                <img src="public/assets/dragon_f2.png" alt="Dragón F2" class="dragon-frame">
                <img src="public/assets/dragon_f3.png" alt="Dragón F3" class="dragon-frame">
                <img src="public/assets/dragon_f4.png" alt="Dragón F4" class="dragon-frame">
            </div>

            <!-- Draggable flowers -->
            <img src="public/assets/sakura_flower.png" class="draggable-flower" id="flower-1">
            <img src="public/assets/sakura_flower.png" class="draggable-flower" id="flower-2">
            <img src="public/assets/sakura_flower.png" class="draggable-flower" id="flower-3">
            <img src="public/assets/sakura_flower.png" class="draggable-flower" id="flower-4">
            
            <!-- Progress Bar for Sakurania -->
            <div id="sakurania-progress-container">
                <div id="sakurania-progress-bar">
                    <div class="sparkles"></div>
                </div>
            </div>
            
            <div id="sakura-rain-container"></div>
            <button id="sakurania-reset-button" class="hidden">VOLVER</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
